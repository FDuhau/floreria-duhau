name: Backup diario

# Descarga TODA la base de Firebase una vez por día y la guarda como .zip en un
# release BORRADOR del repo ("Backups automáticos"). Los borradores solo los ven
# quienes tienen permiso de escritura en el repo, aunque el repo sea público.
#
#  - Todos los días a las 03:00 (hora Argentina) y a mano desde Actions → "Backup diario" → Run workflow.
#  - Guarda los últimos 60 días y, para siempre, el del día 1 de cada mes.
#  - Si falla (o la base viene vacía/incompleta), GitHub te manda un mail.
#
# Requiere UN secret en el repo (Settings → Secrets and variables → Actions):
#   FIREBASE_DB_SECRET — el "secreto de la base de datos" de Firebase (el mismo
#   que ya tiene el Worker en Cloudflare). Se saca de la consola de Firebase:
#   Configuración del proyecto → Cuentas de servicio → Secretos de la base de datos.
#
# Para restaurar: ver docs/BACKUPS.md. NUNCA imprimir datos en el log: el log de
# Actions de un repo público lo puede ver cualquiera.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 Argentina
  workflow_dispatch:

permissions:
  contents: write   # para crear el release borrador y subirle archivos

concurrency:
  group: backup-diario
  cancel-in-progress: false

env:
  DB_URL: https://floreria-duhau-84de5-default-rtdb.firebaseio.com
  RELEASE_TAG: backups-automaticos
  DIAS_A_GUARDAR: '60'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar la base de Firebase
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_DB_SECRET}" ]; then
            echo "::error::Falta el secret FIREBASE_DB_SECRET (ver comentario arriba de .github/workflows/backup.yml)"
            exit 1
          fi
          FECHA=$(TZ=America/Argentina/Buenos_Aires date +%F)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          NOMBRE="backup-floreria-duhau-$FECHA"
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"
          curl -sS --fail --retry 4 --retry-delay 15 --max-time 600 \
            -o "$NOMBRE.json" "$DB_URL/.json?auth=$FIREBASE_DB_SECRET"

      - name: Verificar que el backup no esté vacío
        run: |
          set -euo pipefail
          BYTES=$(stat -c %s "$NOMBRE.json")
          echo "Tamaño: $((BYTES / 1024 / 1024)) MB"
          if [ "$BYTES" -lt 1000000 ]; then
            echo "::error::El backup pesa menos de 1 MB: la base vino vacía o incompleta."
            exit 1
          fi
          # Nodos que siempre tienen que estar. Solo se imprime cuántos hay, no su contenido.
          for NODO in cajaData ventasData stockData eventosData; do
            if ! jq -e --arg n "$NODO" 'has($n)' "$NOMBRE.json" > /dev/null; then
              echo "::error::Falta el nodo $NODO en la base: el backup no es confiable."
              exit 1
            fi
          done
          echo "Nodos en la base: $(jq 'keys | length' "$NOMBRE.json")"
          echo "Movimientos de caja: $(jq '.cajaData | length' "$NOMBRE.json")"

      - name: Comprimir
        run: |
          set -euo pipefail
          zip -9 -q "$NOMBRE.zip" "$NOMBRE.json"
          echo "Zip: $(( $(stat -c %s "$NOMBRE.zip") / 1024 / 1024 )) MB"

      - name: Subir al release borrador y borrar los viejos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          # Buscar el release borrador (los borradores no se encuentran por tag: hay que listarlos)
          REL_ID=$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n1)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$RELEASE_TAG" -f name="Backups automáticos" -F draft=true \
              -f body="Backup diario automático de toda la base de Firebase (ver docs/BACKUPS.md). NO PUBLICAR este release: es un borrador para que solo lo vea quien tiene acceso de escritura." \
              --jq .id)
            echo "Release borrador creado ($REL_ID)"
          fi

          ASSETS=$(gh api "repos/$REPO/releases/$REL_ID/assets?per_page=100" --paginate --jq '.[] | "\(.id) \(.name)"')

          # Si ya había uno de hoy (corrida manual), reemplazarlo
          echo "$ASSETS" | awk -v n="$NOMBRE.zip" '$2 == n {print $1}' | while read -r ID; do
            gh api -X DELETE "repos/$REPO/releases/assets/$ID"
          done

          curl -sS --fail --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"$NOMBRE.zip" \
            "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=$NOMBRE.zip" > /dev/null
          echo "Subido $NOMBRE.zip"

          # Retención: borrar los de más de DIAS_A_GUARDAR días, salvo el del día 1 de cada mes
          LIMITE=$(TZ=America/Argentina/Buenos_Aires date -d "-$DIAS_A_GUARDAR days" +%F)
          echo "$ASSETS" | while read -r ID NAME; do
            [ -z "${NAME:-}" ] && continue
            F=$(echo "$NAME" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            [ -z "$F" ] && continue
            if [[ "$F" < "$LIMITE" && "${F:8:2}" != "01" ]]; then
              gh api -X DELETE "repos/$REPO/releases/assets/$ID"
              echo "Borrado $NAME"
            fi
          done

      - name: Resumen
        run: echo "✅ Backup $NOMBRE.zip guardado en el release borrador \"Backups automáticos\"." >> "$GITHUB_STEP_SUMMARY"
