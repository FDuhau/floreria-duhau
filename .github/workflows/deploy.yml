name: Deploy a Cloudflare

# Despliega la app a Cloudflare Workers.
#  - Automáticamente en cada push a main.
#  - Manualmente desde la pestaña Actions (botón "Run workflow").
#
# Requiere UN secret en el repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (obligatorio) — token con permiso "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  (opcional)    — solo si tu token ve más de una cuenta
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy (wrangler)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
