name: CI

# Chequeos en cada PR y push a main: lint, build y smoke test
# (navega todas las secciones y falla si hay errores JS de la app).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:smoke
